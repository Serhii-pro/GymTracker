<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="description" content="GYM Tracker – Intermediate Advanced Workout PWA" />
  <title>GYM Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="shortcut icon" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────── -->
<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">
        <!-- Dumbbell SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
             fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2"  y="10" width="4" height="4" rx="1"/>
          <rect x="18" y="10" width="4" height="4" rx="1"/>
          <rect x="5"  y="8"  width="3" height="8" rx="1"/>
          <rect x="16" y="8"  width="3" height="8" rx="1"/>
          <line x1="8" y1="12" x2="16" y2="12" stroke-width="2.5"/>
        </svg>
      </div>
      GYM <span>Tracker</span>
    </div>
    <div class="header-actions">
      <div id="save-indicator">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="2 8 6 12 14 4"/>
        </svg>
        Saved
      </div>
      <div id="cloud-indicator" class="cloud-indicator"></div>
      <button class="btn btn-danger btn-sm" onclick="openConfirm()">
        🗑 Reset Week
      </button>
    </div>
  </div>
</header>

<!-- ── Main ────────────────────────────────────────────────── -->
<main>
  <!-- ── Week Navigation ──────────────────────────────────── -->
  <div class="week-nav">
    <button class="btn-week-nav" onclick="prevWeek()" title="Previous week (←)">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>

    <div class="week-nav-center">
      <div class="week-nav-top">
        <span id="week-label" class="week-label-text">Week —</span>
        <span id="week-context" class="week-context-badge badge-current">Current Week</span>
      </div>
      <div id="week-date-range" class="week-date-range">Loading…</div>
    </div>

    <button class="btn-week-nav" onclick="nextWeek()" title="Next week (→)">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>

    <button class="btn btn-ghost btn-sm" id="btn-today" onclick="goToCurrentWeek()">
      Today
    </button>
  </div>

  <!-- ── Stats Bar ─────────────────────────────────────────── -->
  <div class="week-stats" id="week-stats">
    <div class="stats-empty">No exercises logged for this week yet — add some! 💪</div>
  </div>

  <!-- ── Day Cards ─────────────────────────────────────────── -->
  <div class="days-grid" id="days-grid">
    <!-- Populated by render.js → renderAll() -->
  </div>
</main>

<footer>
  Built with ❤️ · <a href="#" onclick="openConfirm(); return false;">Reset Week</a>
</footer>

<!-- ── Add Exercise Modal ───────────────────────────────────── -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title">Add Exercise</div>
        <div class="modal-day-tag" id="modal-day-tag"></div>
      </div>
      <button class="btn-close-modal" onclick="closeModal()" title="Close">✕</button>
    </div>
    <div class="modal-search-wrap">
      <div class="search-wrap-inner">
        <span class="search-icon">🔍</span>
        <input
          class="modal-search"
          id="modal-search"
          type="text"
          placeholder="Search exercises…"
          autocomplete="off"
          oninput="filterExercises(this.value)"
        />
      </div>
    </div>
    <div class="exercise-db-list" id="exercise-db-list"></div>

    <!-- ── Custom Exercise Footer ─────────────────────────── -->
    <div class="modal-custom-footer">

      <!-- Toggle button (collapsed by default) -->
      <button class="btn-custom-toggle" id="btn-custom-toggle"
              onclick="toggleCustomForm()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Add Custom Exercise
      </button>

      <!-- Expandable form (hidden by default) -->
      <div class="custom-exercise-form" id="custom-exercise-form">
        <div class="custom-form-fields">
          <div class="custom-field">
            <label class="custom-label">Exercise Name</label>
            <input
              class="custom-input"
              id="custom-ex-name"
              type="text"
              placeholder="e.g. Cable Face Pull"
              autocomplete="off"
              oninput="validateCustomForm()"
            />
          </div>
          <div class="custom-field">
            <label class="custom-label">Video URL <span class="custom-label-opt">(optional)</span></label>
            <input
              class="custom-input"
              id="custom-ex-url"
              type="url"
              placeholder="https://youtu.be/…"
              autocomplete="off"
              oninput="validateCustomForm()"
            />
          </div>
        </div>
        <div class="custom-form-actions">
          <button class="btn btn-ghost btn-sm" onclick="cancelCustomForm()">Cancel</button>
          <button class="btn btn-neon btn-sm" id="btn-add-custom"
                  onclick="submitCustomExercise()" disabled>
            Add Exercise
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ── Reset Confirm Dialog ─────────────────────────────────── -->
<div id="confirm-overlay" onclick="handleConfirmOverlay(event)">
  <div class="confirm-box">
    <div class="confirm-icon">⚠️</div>
    <div class="confirm-title">Reset the entire week?</div>
    <div class="confirm-text">
      This will permanently remove all exercises and set data.
      This action cannot be undone.
    </div>
    <div class="confirm-actions">
      <button class="btn btn-ghost"  onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger" onclick="confirmReset()">Yes, Reset</button>
    </div>
  </div>
</div>

<!-- ── Scripts (order matters) ──────────────────────────────── -->
<!-- Firebase SDK (compat v9) -->
<script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

<!-- Application Scripts -->
<script src="js/data.js"></script>     <!-- 1. EXERCISE_DB, CUSTOM_EXERCISES, DAYS -->
<script src="js/firebase.js"></script> <!-- 2. Firebase Init, _FB_CONFIG, Cloud sync helpers -->
<script src="js/state.js"></script>    <!-- 3. Offline-first state, loadState, saveState -->
<script src="js/render.js"></script>   <!-- 4. renderAll, rerenderCard, CRUD helpers -->
<script src="js/modal.js"></script>    <!-- 5. openModal, addExercise, custom exercises -->
<script src="js/week.js"></script>     <!-- 6. week nav, stats, prevWeek, nextWeek -->
<script src="js/app.js"></script>      <!-- 7. Bootstrap (runs last) -->

</body>
</html>
