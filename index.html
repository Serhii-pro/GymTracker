<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="description" content="GYM Tracker – Intermediate Advanced Workout PWA" />
  <title>GYM Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    /* ── Reset & Root ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #12121a;
      --card:      #1a1a26;
      --card2:     #20202e;
      --border:    #2a2a3e;
      --neon:      #39ff14;
      --neon2:     #ff6b00;
      --text:      #e8e8f0;
      --muted:     #6b6b8a;
      --danger:    #ff3d5a;
      --radius:    16px;
      --radius-sm: 8px;
      --shadow:    0 8px 32px rgba(0,0,0,.6);
      --glow:      0 0 18px rgba(57,255,20,.25);
      --glow2:     0 0 18px rgba(255,107,0,.25);
      --font:      'Inter', 'Segoe UI', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Scrollbar ──────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--neon); }

    /* ── Noise overlay ──────────────────────────────────── */
    body::before {
      content:'';
      position:fixed; inset:0; pointer-events:none; z-index:0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.03'/%3E%3C/svg%3E");
      opacity:.4;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,15,.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.25rem; font-weight: 800; letter-spacing: -.5px;
    }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--neon), var(--neon2));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; box-shadow: var(--glow);
    }
    .logo span { color: var(--neon); }

    .header-actions { display: flex; align-items: center; gap: 10px; }

    /* ── Save indicator ─────────────────────────────────── */
    #save-indicator {
      display: flex; align-items: center; gap: 6px;
      font-size: .78rem; font-weight: 600; color: var(--neon);
      opacity: 0; transition: opacity .3s;
      padding: 4px 10px; border-radius: 20px;
      background: rgba(57,255,20,.08);
      border: 1px solid rgba(57,255,20,.2);
      white-space: nowrap;
    }
    #save-indicator.visible { opacity: 1; }
    #save-indicator svg { width:14px; height:14px; }

    /* ── Buttons ────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: var(--radius-sm);
      font-size: .85rem; font-weight: 600; cursor: pointer;
      border: none; outline: none; transition: all .18s ease;
      position: relative; overflow: hidden;
      user-select: none;
    }
    .btn::after {
      content:''; position:absolute; inset:0;
      background: rgba(255,255,255,.07);
      opacity:0; transition: opacity .15s;
    }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(.96); }

    .btn-neon {
      background: linear-gradient(135deg, var(--neon), #1dde08);
      color: #000; box-shadow: var(--glow);
    }
    .btn-neon:hover { box-shadow: 0 0 28px rgba(57,255,20,.5); }

    .btn-orange {
      background: linear-gradient(135deg, var(--neon2), #ff8c00);
      color: #fff; box-shadow: var(--glow2);
    }
    .btn-orange:hover { box-shadow: 0 0 28px rgba(255,107,0,.5); }

    .btn-ghost {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--neon); color: var(--neon); }

    .btn-danger {
      background: rgba(255,61,90,.12); color: var(--danger);
      border: 1px solid rgba(255,61,90,.25);
    }
    .btn-danger:hover { background: rgba(255,61,90,.22); box-shadow: 0 0 18px rgba(255,61,90,.3); }

    .btn-sm { padding: 5px 10px; font-size: .78rem; border-radius: 6px; }
    .btn-xs { padding: 3px 8px; font-size: .72rem; border-radius: 5px; }

    /* ── Main ────────────────────────────────────────────── */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 20px 60px;
      position: relative; z-index: 1;
    }

    /* ── Week header ────────────────────────────────────── */
    .week-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
    }
    .week-title {
      font-size: 1.5rem; font-weight: 800; letter-spacing: -.5px;
    }
    .week-title span { color: var(--neon); }

    /* ── Days grid ──────────────────────────────────────── */
    .days-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    /* ── Day card ───────────────────────────────────────── */
    .day-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      animation: cardIn .4s cubic-bezier(.22,1,.36,1) both;
      transition: border-color .25s, box-shadow .25s;
    }
    .day-card:hover {
      border-color: rgba(57,255,20,.2);
      box-shadow: var(--shadow), var(--glow);
    }
    .day-card.rest-day:hover {
      border-color: rgba(107,107,138,.3);
      box-shadow: var(--shadow);
    }

    @keyframes cardIn {
      from { opacity:0; transform: translateY(24px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .day-card:nth-child(1) { animation-delay: .05s; }
    .day-card:nth-child(2) { animation-delay: .10s; }
    .day-card:nth-child(3) { animation-delay: .15s; }
    .day-card:nth-child(4) { animation-delay: .20s; }
    .day-card:nth-child(5) { animation-delay: .25s; }
    .day-card:nth-child(6) { animation-delay: .30s; }
    .day-card:nth-child(7) { animation-delay: .35s; }

    .day-header {
      padding: 16px 18px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .day-header::before {
      content:'';
      position:absolute; left:0; top:0; bottom:0; width:3px;
      background: linear-gradient(180deg, var(--neon), var(--neon2));
      border-radius: 0 2px 2px 0;
    }
    .rest-day .day-header::before { background: var(--muted); opacity: .4; }

    .day-name {
      font-size: 1rem; font-weight: 700; letter-spacing: .02em;
    }
    .day-badge {
      font-size: .7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; padding: 3px 8px; border-radius: 20px;
    }
    .badge-active {
      background: rgba(57,255,20,.12);
      color: var(--neon);
      border: 1px solid rgba(57,255,20,.2);
    }
    .badge-rest {
      background: rgba(107,107,138,.12);
      color: var(--muted);
      border: 1px solid rgba(107,107,138,.2);
    }

    .day-body { padding: 16px 18px; }

    /* ── Rest day ───────────────────────────────────────── */
    .rest-content {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; padding: 20px 0; opacity: .5;
    }
    .rest-icon { font-size: 2.2rem; }
    .rest-text { font-size: .85rem; color: var(--muted); font-weight: 500; }

    /* ── Exercise list ──────────────────────────────────── */
    .exercise-list { display: flex; flex-direction: column; gap: 14px; }

    /* ── Exercise item ──────────────────────────────────── */
    .exercise-item {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      animation: exerciseIn .3s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes exerciseIn {
      from { opacity:0; transform: scaleY(.8); transform-origin: top; }
      to   { opacity:1; transform: scaleY(1); }
    }

    .exercise-header {
      padding: 10px 12px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .exercise-name-link {
      flex: 1; font-size: .9rem; font-weight: 600;
      color: var(--neon); text-decoration: none;
      transition: color .15s;
    }
    .exercise-name-link:hover { color: #fff; text-shadow: 0 0 12px var(--neon); }
    .exercise-name-link::after {
      content: ' ↗';
      font-size: .72em;
      opacity: .6;
    }

    .btn-remove-ex {
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(255,61,90,.1); border: 1px solid rgba(255,61,90,.2);
      color: var(--danger); font-size: .8rem; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .15s; flex-shrink: 0;
    }
    .btn-remove-ex:hover {
      background: rgba(255,61,90,.25);
      box-shadow: 0 0 10px rgba(255,61,90,.3);
      transform: rotate(90deg) scale(1.1);
    }

    /* ── Sets ───────────────────────────────────────────── */
    .sets-container { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

    .set-row {
      display: flex; align-items: center; gap: 8px;
      animation: setIn .25s ease both;
    }
    @keyframes setIn {
      from { opacity:0; transform: translateX(-10px); }
      to   { opacity:1; transform: translateX(0); }
    }

    .set-label {
      font-size: .72rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .04em;
      min-width: 44px; flex-shrink: 0;
    }

    .set-input {
      flex: 1; background: var(--bg);
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-size: .85rem; font-family: var(--font);
      padding: 6px 10px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .set-input::placeholder { color: var(--muted); font-size: .78rem; }
    .set-input:focus {
      border-color: var(--neon);
      box-shadow: 0 0 0 2px rgba(57,255,20,.12);
    }

    .btn-remove-set {
      width: 22px; height: 22px; border-radius: 50%;
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); font-size: .75rem; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .15s; flex-shrink: 0;
    }
    .btn-remove-set:hover {
      border-color: var(--danger); color: var(--danger);
      transform: scale(1.15);
    }

    .sets-actions {
      padding: 0 12px 12px;
      display: flex; gap: 8px;
    }

    /* ── Add exercise area ──────────────────────────────── */
    .add-exercise-area { margin-top: 12px; }

    /* ── Modal ──────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .modal-overlay.open {
      opacity: 1; pointer-events: all;
    }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 24px 80px rgba(0,0,0,.8), var(--glow);
      width: 100%; max-width: 480px;
      max-height: 85vh;
      display: flex; flex-direction: column;
      transform: scale(.92) translateY(20px);
      transition: transform .3s cubic-bezier(.22,1,.36,1);
      overflow: hidden;
    }
    .modal-overlay.open .modal {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      padding: 18px 20px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .modal-title { font-size: 1rem; font-weight: 700; }
    .modal-day-tag {
      font-size: .72rem; color: var(--neon); font-weight: 600;
      background: rgba(57,255,20,.08); padding: 2px 8px; border-radius: 20px;
    }
    .btn-close-modal {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--card2); border: 1px solid var(--border);
      color: var(--muted); font-size: 1rem; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .15s;
    }
    .btn-close-modal:hover { color: var(--danger); border-color: var(--danger); transform: rotate(90deg); }

    .modal-search-wrap { padding: 14px 20px; border-bottom: 1px solid var(--border); }
    .modal-search {
      width: 100%;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text);
      font-size: .9rem; font-family: var(--font);
      padding: 9px 14px 9px 36px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .modal-search:focus {
      border-color: var(--neon);
      box-shadow: 0 0 0 3px rgba(57,255,20,.1);
    }
    .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: .95rem; pointer-events: none;
    }
    .search-wrap-inner { position: relative; }

    .exercise-db-list {
      overflow-y: auto;
      padding: 10px 12px;
      display: flex; flex-direction: column; gap: 4px;
      flex: 1;
    }

    .db-item {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      transition: background .15s, transform .1s;
      border: 1px solid transparent;
    }
    .db-item:hover {
      background: rgba(57,255,20,.08);
      border-color: rgba(57,255,20,.15);
      transform: translateX(4px);
    }
    .db-item.already-added {
      opacity: .4; cursor: default; pointer-events: none;
    }
    .db-item-name { font-size: .88rem; font-weight: 500; }
    .db-item-add {
      color: var(--neon); font-size: .72rem; font-weight: 700;
      opacity: 0; transition: opacity .15s;
      white-space: nowrap;
    }
    .db-item:hover .db-item-add { opacity: 1; }
    .db-no-results {
      text-align: center; padding: 32px; color: var(--muted);
      font-size: .88rem;
    }

    /* ── Clear confirm ──────────────────────────────────── */
    #confirm-overlay {
      position: fixed; inset: 0; z-index: 600;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    #confirm-overlay.open { opacity: 1; pointer-events: all; }
    .confirm-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 28px;
      max-width: 380px; width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,.8);
      transform: scale(.9);
      transition: transform .25s cubic-bezier(.22,1,.36,1);
    }
    #confirm-overlay.open .confirm-box { transform: scale(1); }
    .confirm-icon { font-size: 2.5rem; margin-bottom: 10px; }
    .confirm-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
    .confirm-text { font-size: .85rem; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
    .confirm-actions { display: flex; gap: 10px; justify-content: center; }

    /* ── Exercise count badge ───────────────────────────── */
    .ex-count {
      font-size: .7rem; font-weight: 700; color: var(--muted);
      margin-left: 6px; padding: 1px 6px;
      background: var(--surface); border-radius: 20px;
    }

    /* ── Footer ─────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 20px;
      font-size: .75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      position: relative; z-index: 1;
    }
    footer a { color: var(--neon); text-decoration: none; }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 640px) {
      .days-grid { grid-template-columns: 1fr; }
      .week-header { flex-direction: column; align-items: flex-start; }
    }

    /* ── Pulse animation for neon elements ──────────────── */
    @keyframes pulse-neon {
      0%, 100% { box-shadow: var(--glow); }
      50% { box-shadow: 0 0 30px rgba(57,255,20,.5); }
    }
    .btn-neon { animation: pulse-neon 3s infinite; }

    /* ── Shimmer for rest day ───────────────────────────── */
    .rest-day { opacity: .8; }

    /* ── Progress dots ──────────────────────────────────── */
    .day-progress {
      display: flex; gap: 4px; margin-top: 6px;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--border);
      transition: background .2s;
    }
    .dot.filled { background: var(--neon); box-shadow: 0 0 6px var(--neon); }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────── -->
<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">💪</div>
      GYM <span>Tracker</span>
    </div>
    <div class="header-actions">
      <div id="save-indicator">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="2 8 6 12 14 4"/>
        </svg>
        Saved
      </div>
      <button class="btn btn-danger btn-sm" onclick="openConfirm()">
        🗑 Reset Week
      </button>
    </div>
  </div>
</header>

<!-- ── Main ────────────────────────────────────────────────── -->
<main>
  <div class="week-header">
    <div>
      <div class="week-title">Weekly <span>Schedule</span></div>
      <div style="font-size:.82rem; color:var(--muted); margin-top:4px;">
        Intermediate–Advanced · Foundation Block
      </div>
    </div>
  </div>

  <div class="days-grid" id="days-grid">
    <!-- JS renders cards here -->
  </div>
</main>

<footer>
  Built with ❤️ · <a href="#" onclick="openConfirm(); return false;">Reset Week</a>
</footer>

<!-- ── Exercise Modal ───────────────────────────────────────── -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title">Add Exercise</div>
        <div class="modal-day-tag" id="modal-day-tag"></div>
      </div>
      <button class="btn-close-modal" onclick="closeModal()" title="Close">✕</button>
    </div>
    <div class="modal-search-wrap">
      <div class="search-wrap-inner">
        <span class="search-icon">🔍</span>
        <input
          class="modal-search"
          id="modal-search"
          type="text"
          placeholder="Search exercises…"
          autocomplete="off"
          oninput="filterExercises(this.value)"
        />
      </div>
    </div>
    <div class="exercise-db-list" id="exercise-db-list"></div>
  </div>
</div>

<!-- ── Confirm Modal ────────────────────────────────────────── -->
<div id="confirm-overlay" onclick="handleConfirmOverlay(event)">
  <div class="confirm-box">
    <div class="confirm-icon">⚠️</div>
    <div class="confirm-title">Reset the entire week?</div>
    <div class="confirm-text">This will permanently remove all exercises and set data. This action cannot be undone.</div>
    <div class="confirm-actions">
      <button class="btn btn-ghost" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger" onclick="confirmReset()">Yes, Reset</button>
    </div>
  </div>
</div>

<script>
// ── Exercise Database ─────────────────────────────────────────
const EXERCISE_DB = [
  {"name":"45° Incline Barbell Press","videoUrl":"https://youtu.be/vqQ9ok0dEgk"},
  {"name":"45° Incline DB Press","videoUrl":"https://www.youtube.com/watch?v=p2t9daxLpB8"},
  {"name":"Cable Crossover Ladder","videoUrl":"https://youtu.be/0TP9kVcWGic"},
  {"name":"Wide-Grip Pull-Up","videoUrl":"https://youtu.be/yGnp0HU8BnA"},
  {"name":"Neutral-Grip Lat Pulldown","videoUrl":"https://youtu.be/lA4_1F9EAFU"},
  {"name":"High-Cable Lateral Raise","videoUrl":"https://youtu.be/MnMux3Wc0Ac"},
  {"name":"Pendlay Deficit Row","videoUrl":"https://youtu.be/MmuyHKYCLps"},
  {"name":"Chest-Supported Machine Row","videoUrl":"https://youtu.be/ijsSiWSzYw0"},
  {"name":"Overhead Cable Triceps Extension (Rope)","videoUrl":"https://youtu.be/GYoUoVNlbGc"},
  {"name":"DB Skull Crusher","videoUrl":"https://youtu.be/fbLTzgTKOR8"},
  {"name":"Bayesian Cable Curl","videoUrl":"https://youtu.be/CWH5J_7kzjM"},
  {"name":"Dumbbell Hammer Curl","videoUrl":"https://youtu.be/xY3sQXYhk7A"},
  {"name":"Dumbbell Preacher Curl","videoUrl":"https://youtu.be/WTkQLAethtg"},
  {"name":"Lying Leg Curl","videoUrl":"https://youtu.be/sX4tGtcc62k"},
  {"name":"DB Bulgarian Split Squat","videoUrl":"https://youtu.be/htDXu61MPio"},
  {"name":"Leg Press","videoUrl":"https://youtu.be/1yKAQLVV_XI"},
  {"name":"Barbell RDL","videoUrl":"https://youtu.be/3fJwfg51cv0"},
  {"name":"Leg Extension","videoUrl":"https://youtu.be/uFbNtqP966A"},
  {"name":"Standing Calf Raise","videoUrl":"https://youtu.be/6lR2JdxUh7w"},
  {"name":"Cable Crunch","videoUrl":"https://youtu.be/epBrpaGHMcg"},
  {"name":"Machine Hip Adduction","videoUrl":"https://youtu.be/FMSCZYu1JhE"},
  {"name":"Machine Hip Abduction","videoUrl":"https://youtu.be/pozooPg6PBE"},
  {"name":"Barbell Bench Press","videoUrl":"https://youtu.be/nQL5ieH39sw"},
  {"name":"Machine Shoulder Press","videoUrl":"https://youtu.be/SCQVmN1gYsk"}
];

// ── Day Definitions ───────────────────────────────────────────
const DAYS = [
  { key: 'monday',    label: 'Monday',    active: true  },
  { key: 'tuesday',   label: 'Tuesday',   active: false },
  { key: 'wednesday', label: 'Wednesday', active: true  },
  { key: 'thursday',  label: 'Thursday',  active: false },
  { key: 'friday',    label: 'Friday',    active: true  },
  { key: 'saturday',  label: 'Saturday',  active: true  },
  { key: 'sunday',    label: 'Sunday',    active: false },
];

// ── State ─────────────────────────────────────────────────────
// state[dayKey] = [ { name, videoUrl, sets: ['','','',''] } ]
let state = {};
let modalDayKey = null;
let saveTimer = null;

// ── LocalStorage ──────────────────────────────────────────────
const STORAGE_KEY = 'gymtracker_v2';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch(e) { state = {}; }
  // Ensure all active day keys exist
  DAYS.forEach(d => {
    if (d.active && !state[d.key]) state[d.key] = [];
  });
}

let saveIndicatorTimer = null;
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  // Show indicator
  const ind = document.getElementById('save-indicator');
  ind.classList.add('visible');
  clearTimeout(saveIndicatorTimer);
  saveIndicatorTimer = setTimeout(() => ind.classList.remove('visible'), 1800);
}

// ── Render ────────────────────────────────────────────────────
function renderAll() {
  const grid = document.getElementById('days-grid');
  grid.innerHTML = '';
  DAYS.forEach(day => {
    const card = document.createElement('div');
    card.className = 'day-card' + (day.active ? '' : ' rest-day');
    card.id = 'card-' + day.key;
    card.innerHTML = buildCard(day);
    grid.appendChild(card);
  });
}

function buildCard(day) {
  const badge = day.active
    ? '<span class="day-badge badge-active">Workout</span>'
    : '<span class="day-badge badge-rest">Rest Day</span>';

  const exCount = day.active ? (state[day.key] || []).length : 0;
  const countBadge = day.active ? `<span class="ex-count">${exCount}</span>` : '';

  const header = `
    <div class="day-header">
      <div>
        <div class="day-name">${day.label}${countBadge}</div>
        <div class="day-progress">${buildDots(day)}</div>
      </div>
      ${badge}
    </div>`;

  if (!day.active) {
    return header + `
      <div class="day-body">
        <div class="rest-content">
          <div class="rest-icon">😴</div>
          <div class="rest-text">Recovery Day · No Training</div>
        </div>
      </div>`;
  }

  const exercises = (state[day.key] || []).map((ex, i) => buildExerciseItem(day.key, ex, i)).join('');

  return header + `
    <div class="day-body">
      <div class="exercise-list" id="list-${day.key}">
        ${exercises}
      </div>
      <div class="add-exercise-area" style="margin-top:${exCount > 0 ? '14px' : '4px'}">
        <button class="btn btn-neon btn-sm" style="width:100%; justify-content:center;"
          onclick="openModal('${day.key}')">
          + Add Exercise
        </button>
      </div>
    </div>`;
}

function buildDots(day) {
  if (!day.active) return '';
  const count = (state[day.key] || []).length;
  const max = Math.max(count, 4);
  return Array.from({length: max}, (_,i) =>
    `<div class="dot${i < count ? ' filled' : ''}"></div>`
  ).join('');
}

function buildExerciseItem(dayKey, ex, idx) {
  const sets = ex.sets || ['','','',''];
  const setsHtml = sets.map((val, si) => `
    <div class="set-row" id="setrow-${dayKey}-${idx}-${si}">
      <span class="set-label">Set ${si+1}</span>
      <input
        class="set-input"
        type="text"
        value="${escHtml(val)}"
        placeholder="e.g. 50kg × 8"
        oninput="updateSet('${dayKey}',${idx},${si},this.value)"
      />
      <button class="btn-remove-set" title="Remove set"
        onclick="removeSet('${dayKey}',${idx},${si})">✕</button>
    </div>`).join('');

  return `
  <div class="exercise-item" id="ex-${dayKey}-${idx}">
    <div class="exercise-header">
      <a class="exercise-name-link" href="${escHtml(ex.videoUrl)}" target="_blank" rel="noopener noreferrer">
        ${escHtml(ex.name)}
      </a>
      <button class="btn-remove-ex" title="Remove exercise"
        onclick="removeExercise('${dayKey}',${idx})">✕</button>
    </div>
    <div class="sets-container" id="sets-${dayKey}-${idx}">
      ${setsHtml}
    </div>
    <div class="sets-actions">
      <button class="btn btn-ghost btn-xs" onclick="addSet('${dayKey}',${idx})">+ Add Set</button>
    </div>
  </div>`;
}

// ── Escape HTML ───────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Exercise CRUD ─────────────────────────────────────────────
function removeExercise(dayKey, idx) {
  state[dayKey].splice(idx, 1);
  saveState();
  rerenderCard(dayKey);
}

function addSet(dayKey, idx) {
  state[dayKey][idx].sets.push('');
  saveState();
  rerenderCard(dayKey);
}

function removeSet(dayKey, idx, setIdx) {
  if (state[dayKey][idx].sets.length <= 1) return;
  state[dayKey][idx].sets.splice(setIdx, 1);
  saveState();
  rerenderCard(dayKey);
}

function updateSet(dayKey, idx, setIdx, value) {
  state[dayKey][idx].sets[setIdx] = value;
  saveState();
}

function rerenderCard(dayKey) {
  const day = DAYS.find(d => d.key === dayKey);
  const card = document.getElementById('card-' + dayKey);
  if (!card || !day) return;
  card.innerHTML = buildCard(day);
}

// ── Modal ─────────────────────────────────────────────────────
function openModal(dayKey) {
  modalDayKey = dayKey;
  const day = DAYS.find(d => d.key === dayKey);
  document.getElementById('modal-day-tag').textContent = day ? day.label : '';
  document.getElementById('modal-search').value = '';
  renderDbList('');
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.add('open');
  setTimeout(() => document.getElementById('modal-search').focus(), 200);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  modalDayKey = null;
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function filterExercises(query) {
  renderDbList(query);
}

function renderDbList(query) {
  const list = document.getElementById('exercise-db-list');
  const q = query.trim().toLowerCase();
  const alreadyAdded = new Set((state[modalDayKey] || []).map(e => e.name));

  const filtered = EXERCISE_DB.filter(ex =>
    !q || ex.name.toLowerCase().includes(q)
  );

  if (!filtered.length) {
    list.innerHTML = '<div class="db-no-results">No exercises found 🔍</div>';
    return;
  }

  list.innerHTML = filtered.map(ex => {
    const added = alreadyAdded.has(ex.name);
    return `
    <div class="db-item${added ? ' already-added' : ''}"
      onclick="${added ? '' : `addExercise('${ex.name.replace(/'/g,"\\'")}','${ex.videoUrl.replace(/'/g,"\\'")}');`}">
      <span class="db-item-name">${ex.name}${added ? ' ✓' : ''}</span>
      <span class="db-item-add">+ Add</span>
    </div>`;
  }).join('');
}

function addExercise(name, videoUrl) {
  if (!modalDayKey) return;
  if (!state[modalDayKey]) state[modalDayKey] = [];
  // Prevent duplicates
  if (state[modalDayKey].some(e => e.name === name)) return;
  state[modalDayKey].push({ name, videoUrl, sets: ['','','',''] });
  saveState();
  rerenderCard(modalDayKey);
  // Refresh list to mark as added
  renderDbList(document.getElementById('modal-search').value);
}

// ── Confirm/Reset ─────────────────────────────────────────────
function openConfirm() {
  document.getElementById('confirm-overlay').classList.add('open');
}
function closeConfirm() {
  document.getElementById('confirm-overlay').classList.remove('open');
}
function handleConfirmOverlay(e) {
  if (e.target === document.getElementById('confirm-overlay')) closeConfirm();
}
function confirmReset() {
  localStorage.removeItem(STORAGE_KEY);
  state = {};
  DAYS.forEach(d => { if (d.active) state[d.key] = []; });
  closeConfirm();
  renderAll();
  saveState();
}

// ── Keyboard shortcuts ────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal();
    closeConfirm();
  }
});

// ── Init ──────────────────────────────────────────────────────
loadState();
renderAll();
</script>
</body>
</html>
